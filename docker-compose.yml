services:

  hmpps-auth:
    image: ghcr.io/ministryofjustice/hmpps-auth:latest
    networks:
      - hmpps
    container_name: hmpps-auth
    ports:
      - "9090:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - APPLICATION_AUTHENTICATION_UI_ALLOWLIST=0.0.0.0/0

  hmpps-template-kotlin:
    image: ghcr.io/ministryofjustice/hmpps-template-kotlin:latest
    networks:
      - hmpps
    container_name: hmpps-template-kotlin
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
    environment:
      - HMPPS_AUTH_URL=http://hmpps-auth:8080/auth
      - EXAMPLE_API_URL=http://localhost:8080

  redis:
    image: 'redis:8.10'
    networks:
      - hmpps
    container_name: redis-organisations
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  # Fake SQS queue for audit messages; mainQueue is created from the mounted config
  elasticmq:
    image: softwaremill/elasticmq-native
    networks:
      - hmpps
    container_name: elasticmq-organisations
    ports:
      - '9324:9324'
    volumes:
      - ./local-elasticmq/elasticmq.conf:/opt/elasticmq.conf

  app:
    build:
      context: .
      args:
        BUILD_NUMBER: "1.0.0"
        GIT_REF: "a1b2c3"
        GIT_BRANCH: main
    networks:
      - hmpps
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/3000"]
    environment:
      - PRODUCT_ID=UNASSIGNED
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - AUDIT_ENABLED=true
      - AUDIT_SQS_QUEUE_URL=http://elasticmq:9324/000000000000/mainQueue
      - AUDIT_SERVICE_NAME=hmpps-organisations-ui
      - AUDIT_SQS_REGION=eu-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - HMPPS_AUTH_EXTERNAL_URL=http://localhost:9090/auth
      - HMPPS_AUTH_URL=http://hmpps-auth:8080/auth
      # These will need to match new creds in the seed auth service auth
      - AUTH_CODE_CLIENT_ID=hmpps-typescript-template
      - AUTH_CODE_CLIENT_SECRET=clientsecret
      - CLIENT_CREDS_CLIENT_ID=hmpps-typescript-template-system
      - CLIENT_CREDS_CLIENT_SECRET=clientsecret
      - SESSION_SECRET=somesecretvalue
      - TOKEN_VERIFICATION_API_URL=http://hmpps-auth:8080/auth
      - TOKEN_VERIFICATION_ENABLED=false
      - INGRESS_URL=http://localhost:3000
      - NO_HTTPS=true

networks:
  hmpps:
